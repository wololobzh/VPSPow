services:
  webserver:
    image: nginx:latest
    container_name: mon-site-webserver
    ports:
      - "8282:80"
    volumes:
      - ./le-build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: mon-site-backend
    ports:
      - "4000:4000"
