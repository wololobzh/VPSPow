<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Style cyber grid -->
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #1a1a1d, #0c0c0e 70%);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <div class="relative z-10 w-full max-w-md">

    <div class="backdrop-blur-xl bg-black/30 border border-purple-700/40 rounded-xl shadow-2xl p-8 
                animate-[fadeIn_0.5s_ease-out]">

      <h1 class="text-center text-3xl font-bold text-purple-400 mb-6">
        🔐 Connexion
      </h1>

      <p class="text-center text-gray-300 mb-6">
        Espace sécurisé – accès réservé
      </p>

      <form id="loginForm" class="space-y-5">

        <!-- Username -->
        <div>
          <label class="block text-gray-300 mb-1">Nom d'utilisateur</label>
          <input
            type="text"
            name="username"
            class="w-full px-4 py-3 rounded-lg bg-black/40 border border-purple-600/40 
                   text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="admin"
            required
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-gray-300 mb-1">Mot de passe</label>
          <input
            type="password"
            name="password"
            class="w-full px-4 py-3 rounded-lg bg-black/40 border border-purple-600/40 
                   text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full py-3 rounded-lg bg-purple-600 hover:bg-purple-700 
                 text-white font-semibold transition-all shadow-md hover:shadow-purple-600/30"
        >
          Se connecter
        </button>

      </form>

      <p id="errorMsg" class="text-center text-red-400 mt-4 hidden">
        Identifiants incorrects.
      </p>

    </div>

  </div>

  <!-- Script Login -->
  <script>
    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();

      const payload = {
        username: e.target.username.value,
        password: e.target.password.value
      };

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        window.location = "/";
      } else {
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.classList.remove("hidden");
      }
    };
  </script>

</body>
</html>
