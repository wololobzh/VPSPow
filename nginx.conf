user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    server {
        listen 80;

        error_page 401 =302 /login;
        error_page 403 /403.html;
        error_page 404 /404.html;

        # --- PUBLIC PAGES ---
        location = /login {
            root /usr/share/nginx/html;
            try_files /login.html =404;
        }

        location /public {
            root /usr/share/nginx/html;
        }

        # --- STATIC SPAs ---
        location / {
            auth_request /jwt-verify;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /admin {
            auth_request /jwt-verify-admin;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # --- JWT VERIFY ---
        location = /jwt-verify {
            internal;
            proxy_pass http://backend:4000/auth/verify;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        location = /jwt-verify-admin {
            internal;
            proxy_pass http://backend:4000/auth/verify;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Required-Role "admin";
        }

        # --- API LOGIN ---
        location /auth/login {
            proxy_pass http://backend:4000/auth/login;
        }
    }
}
