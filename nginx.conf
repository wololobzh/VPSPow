user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    server {
        listen 80;

        # Toutes les pages statiques passent par une vérification JWT
        location / {
            auth_request /jwt-verify;
            try_files $uri $uri/ /index.html;
        }

        # Vérification JWT (via le backend)
        location = /jwt-verify {
            internal;
            proxy_pass http://backend:4000/auth/verify;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # Endpoint login (redirigé vers backend)
        location /auth/login {
            proxy_pass http://backend:4000/auth/login;
        }

        # Page de login front (à mettre dans build/login.html)
        location /login {
            try_files $uri $uri/ /login.html;
        }

        # Fichiers statiques
        location / {
            root /usr/share/nginx/html;
        }
    }
}
