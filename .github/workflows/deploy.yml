name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: asciidoctor/docker-asciidoctor
      volumes:
        - .:/workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -d

      - name: Report
        if: failure()
        run: |
          title="Erreur de build"
          echo "::warning title=$title::Build écourté, lancez le script de build en local pour plus d'informations"

      - name: Install tar
        run: |
          apk update
          apk add tar

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
          name: artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1