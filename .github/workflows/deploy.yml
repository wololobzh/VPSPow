name: Build and Deploy to VPS (Docker Nginx)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -d

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build

      - name: Upload compose file
        uses: actions/upload-artifact@v4
        with:
          name: compose-file
          path: docker-compose.yml

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./build

      - name: Download compose file
        uses: actions/download-artifact@v4
        with:
          name: compose-file
          path: ./

      # 🔐 Setup SSH
      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 🔐 Add host key automatically
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 51.254.205.63 >> ~/.ssh/known_hosts

      # 📦 Deploy build/
      - name: Deploy build to VPS
        run: |
          rsync -avz --delete ./build/ ubuntu@51.254.205.63:/home/ubuntu/mon-site/build

      # 📦 Deploy docker-compose.yml
      - name: Deploy compose file to VPS
        run: |
          rsync -avz docker-compose.yml ubuntu@51.254.205.63:/home/ubuntu/mon-site/docker-compose.yml

      # 🧪 Debug: list directory on VPS
      - name: List remote directory
        run: |
          ssh ubuntu@51.254.205.63 "ls -l /home/ubuntu/mon-site"

      # 🔄 Restart containers
      - name: Restart Docker Compose
        run: |
          ssh ubuntu@51.254.205.63 "cd /home/ubuntu/mon-site && docker compose up -d --build"
