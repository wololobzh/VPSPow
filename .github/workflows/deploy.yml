name: Build and Deploy to VPS (Docker Nginx)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: asciidoctor/docker-asciidoctor
      volumes:
        - .:/workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -d

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./build

      # 🔐 Setup SSH
      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "|1|TME6gLhvk9CBat6CUQoeHyfX1Rk=|YwWqo3fN8IyzYDrjUYMDz2pg9dk= ssh-rsa " >> ~/.ssh/known_hosts
          echo "|1|w9oASUNQA6nLrF7Ydw8alaGHC4U=|v0UpLBz5We3XCA1DSCp1MUQMQfg= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEsaEydNk4E4FaPkuMZWYo01X61FAjRIHVZ/vCnmrgmzZxsYYb2UImXzx1JRAhFwWepfiSpkZ2ol7kDm4Z+aJeo=" >> ~/.ssh/known_hosts
          echo "|1|2lPuQMVdZc8gL2FWIqs0TEXTTos=|IRAMJLESLIFh/5aN5VEOnSNHmus= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDvHDdLY+9ARujFc8GumH+trLtXwyIZSFGEeYoAnEMmE" >> ~/.ssh/known_hosts

      # 📦 Déploiement du build vers /home/ubuntu/mon-site/build
      - name: Deploy build to VPS
        run: |
          rsync -avz --delete ./build/ ubuntu@51.254.205.63:/home/ubuntu/mon-site/build

      # 🔄 Redémarrer Docker (nginx recharge automatiquement les fichiers)
      - name: Restart docker compose
        run: |
          ssh ubuntu@51.254.205.63 "cd /home/ubuntu/mon-site && docker compose up -d"
