name: Build and Deploy to VPS

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: asciidoctor/docker-asciidoctor
      volumes:
        - .:/workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -d

      - name: Report
        if: failure()
        run: |
          title="Erreur de build"
          echo "::warning title=$title::Build écourté, lancez le script de build en local pour plus d'informations"

      - name: Install tar
        run: |
          apk update
          apk add tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Récupérer les fichiers buildés
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./build

      # 2️⃣ Setup SSH
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3️⃣ Ajouter ton VPS dans known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "|1|TME6gLhvk9CBat6CUQoeHyfX1Rk=|YwWqo3fN8IyzYDrjUYMDz2pg9dk= ssh-rsa " >> ~/.ssh/known_hosts
          echo "|1|w9oASUNQA6nLrF7Ydw8alaGHC4U=|v0UpLBz5We3XCA1DSCp1MUQMQfg= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEsaEydNk4E4FaPkuMZWYo01X61FAjRIHVZ/vCnmrgmzZxsYYb2UImXzx1JRAhFwWepfiSpkZ2ol7kDm4Z+aJeo=" >> ~/.ssh/known_hosts
          echo "|1|2lPuQMVdZc8gL2FWIqs0TEXTTos=|IRAMJLESLIFh/5aN5VEOnSNHmus= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDvHDdLY+9ARujFc8GumH+trLtXwyIZSFGEeYoAnEMmE" >> ~/.ssh/known_hosts

      # 4️⃣ Déploiement via rsync (on envoie uniquement /build/)
      - name: Deploy to VPS
        run: |
          rsync -avz --delete ./build/ ubuntu@51.254.205.63:/home/ubuntu/mon-site

      # 5️⃣ Redémarrer Docker sur le VPS
      - name: Restart Docker
        run: |
          ssh ubuntu@51.254.205.63 "cd /home/ubuntu/mon-site && docker compose up -d --build"
